<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculatorContainer">
        <div class="calculator">
            <div class="screenContainer">
                <div class="screen">
                    <div class="screenTop"></div>
                    <div class="screenBottom"></div>
                </div>
            </div>
            <div class="buttonsContainer">
                <div class="numberButtons">
                    <div class="row">
                        <button class="numberButton" value="7">7</button>
                        <button class="numberButton" value="8">8</button>
                        <button class="numberButton" value="9">9</button>
                    </div>
                    <div class="row">
                        <button class="numberButton" value="4">4</button>
                        <button class="numberButton" value="5">5</button>
                        <button class="numberButton" value="6">6</button>
                    </div>
                    <div class="row">
                        <button class="numberButton" value="1">1</button>
                        <button class="numberButton" value="2">2</button>
                        <button class="numberButton" value="3">3</button>
                    </div>
                    <div class="row">
                        <button class="numberButton" value="0">0</button>
                        <button class="numberButton" value="00">00</button>
                        <button class="numberButton" value=".">.</button>
                    </div>
                </div>
                <div class="operatorButtons">
                    <button class="button" value="+">+</button>
                    <button class="button" value="-">-</button>
                    <button class="button" value="*">x</button>
                    <button class="button" value="/">/</button>
                    <button class="button" value="=">=</button>
                    <button class="button" value="C">C</button>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js" defer></script>
</body>
</html>
