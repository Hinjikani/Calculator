<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculatorContainer">
        <div class="calculator">
            <div class="screenContainer">
                <div class="screen">
                    <div class="screenTop"></div>
                    <div class="screenBottom"></div>
                </div>
            </div>
            <div class="buttonsContainer">
                <div class="numberButtons">
                    <div class="row">
                        <button class="numberButton">C</button>
                        <button class="numberButton"></button>
                        <button class="numberButton"></button>
                        <button class="numberButton" id="deleteButton">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                            <path d="M20 5a2 2 0 0 1 1.995 1.85l.005 .15v10a2 2 0 0 1 -1.85 1.995l-.15 .005h-11a1 1 0 0 1 -.608 -.206l-.1 -.087l-5.037 -5.04c-.809 -.904 -.847 -2.25 -.083 -3.23l.12 -.144l5 -5a1 1 0 0 1 .577 -.284l.131 -.009h11zm-7.489 4.14a1 1 0 0 0 -1.301 1.473l.083 .094l1.292 1.293l-1.292 1.293l-.083 .094a1 1 0 0 0 1.403 1.403l.094 -.083l1.293 -1.292l1.293 1.292l.094 .083a1 1 0 0 0 1.403 -1.403l-.083 -.094l-1.292 -1.293l1.292 -1.293l.083 -.094a1 1 0 0 0 -1.403 -1.403l-.094 .083l-1.293 1.292l-1.293 -1.292l-.094 -.083l-.102 -.07z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="row">
                        <button class="numberButton"></button>
                        <button class="numberButton"></button>
                        <button class="numberButton"></button>
                        <button class="numberButton">/</button>
                    </div>
                    <div class="row">
                        <button class="numberButton">7</button>
                        <button class="numberButton">8</button>
                        <button class="numberButton">9</button>
                        <button class="numberButton">x</button>
                    </div>
                    <div class="row">
                        <button class="numberButton">4</button>
                        <button class="numberButton">5</button>
                        <button class="numberButton">6</button>
                        <button class="numberButton">-</button>
                    </div>
                    <div class="plusRow">
                        <div class="numbers">
                            <div class="row">
                                <button class="numberButton">1</button>
                                <button class="numberButton">2</button>
                                <button class="numberButton">3</button>
                            </div>
                            <div class="row">
                                <button class="numberButton">0</button>
                                <button class="numberButton">.</button>
                                <button class="numberButton">=</button>
                            </div>
                        </div>
                        <button class="plusButton">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js" defer></script>
</body>
</html>
